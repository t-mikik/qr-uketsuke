      function adjustFontSizeToFit(context, text, maxWidth, maxHeight) {
        let fontSize = 30;
        context2.font = `${fontSize}px Arial`;
        while (context2.measureText(text).width < maxWidth && fontSize < maxHeight) {
          fontSize += 1;
          context2.font = `${fontSize}px Arial`;
        }
        txt_height =  context2.measureText(text).actualBoundingBoxAscent + context2.measureText(text).actualBoundingBoxDescent;
        return fontSize;
      }

      function resizeCanvas() {
        canvas2.width = window.innerWidth;
        canvas2.height = window.innerHeight;
      }

      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();
      
      if ('mediaDevices' in navigator && 'getUserMedia' in navigator.mediaDevices) {
      navigator.mediaDevices.getUserMedia({video: true})
      }
      

      async function getCameras() {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoDevices = devices.filter(device => device.kind === 'videoinput');
        if (videoDevices.length > 0) {
          hideErrorMessage();
          cameraSelect.innerHTML = '';
          videoDevices.forEach((device, index) => {
            const option = document.createElement('option');
            option.value = device.deviceId;
            option.text = device.label || `Camera ${index + 1}`;
            cameraSelect.appendChild(option);
          });
          cameraSelect.addEventListener('change', () => {
            startCamera(cameraSelect.value);
          });
          if (videoDevices.length > 1 && showCameraSelection) {
            cameraSelect.style.display = 'block';
          }
        } else {
          errorTimeout = setTimeout(() => {
            displayErrorMessage('カメラデバイスが見つかりませんでした', 'Camera device not found.');
          }, 5000);
        }
      } catch (error) {
        errorTimeout = setTimeout(() => {
          displayErrorMessage('カメラデバイスの取得に失敗しました', 'Failed to get camera device.');
        }, 5000);
        console.error(error);
      }
    }

    async function startCamera(deviceId) {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
      const constraints = {
        video: { 
          deviceId: deviceId ? { exact: deviceId } : undefined,
          width: { ideal: window.innerWidth },
          height: { ideal: window.innerHeight }
        } 
      };

      while (true) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia(constraints);
          currentStream = stream;
          video.srcObject = stream;
          video.setAttribute('playsinline', true);
          video.play();
          hideErrorMessage();
          clearTimeout(errorTimeout);
          requestAnimationFrame(tick);
          break;
        } catch (error) {
          console.error(error);
          await new Promise(resolve => setTimeout(resolve, 1000)); // 1秒待機
        }
      }
    }

        errorMessage.style.display = 'block';

    function hideErrorMessage() {
      errorMessage.style.display = 'none';
    }

              }           
            }else{
              if(lines==1){
                context2.fillText(message, canvas2.width/2, canvas2.height/3-(txt_height/2+txt_height*0.1));
              }else if(lines==2){
                context2.fillText(message, canvas2.width/2, canvas2.height/2-txt_height/2);    
              }
              else{
                context2.fillText(message, canvas2.width/2, (canvas2.height/3)*2-txt_height/2+txt_height/2*0.1); 
              }
            }         
          default:
          break;
        }
      }

      let show_title = [true,0,new Date().getTime()];

      function tick() {
        if(!show_title[0]){
          if (video.readyState === video.HAVE_ENOUGH_DATA) {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const context = canvas.getContext('2d');
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
            const code = jsQR(imageData.data, imageData.width, imageData.height);
            if (code && code.data) {
              if (code.data !== lastScannedCode) {
                lastScannedCode = code.data;
                fetch(GAS_URL, {method:"POST",body:JSON.stringify({action:"checkDataInList",data:code.data})}).then(r=>r.json()).then(function(result) {
                    if (result.status === "scanned") {
                    se_ok.play();
                    console.log(showCodeData);
                    if(showCodeData==="true"){
                      displayMessage(code.data,1,1);                                        
                    }else{
                      displayMessage(OKMessage1,1,1);
                    }                  
                    fetch(GAS_URL, {method:"POST",body:JSON.stringify({action:"appendDataToSheet",data:code.data,state:result.status})});
                  } else if (result.status === "alreadyScanned"){
                    se_ok.play();
                    if(showCodeData==="true"){
                      displayMessage(code.data, 4,1);
                      displayMessage(acceptedMessage1, 4,2);
                      displayMessage(acceptedMessage2, 4,3);                      
                    }
                    else{
                      displayMessage(acceptedMessage1, 3,1);
                      displayMessage(acceptedMessage2, 3,2);
                    }
                    fetch(GAS_URL, {method:"POST",body:JSON.stringify({action:"appendDataToSheet",data:code.data,state:result.status})});
                  } else {
                    se_error.play();
                    displayMessage(noDataMessage1, 2,1);
                    displayMessage(noDataMessage2, 2,2);
                    fetch(GAS_URL, {method:"POST",body:JSON.stringify({action:"appendDataToSheet",data:code.data,state:result.status})});
                  }
                  if (displayTimeout) {
                    clearTimeout(displayTimeout);
                  }
                  displayTimeout = setTimeout(() => {
                    context2.clearRect(0, 0, canvas2.width, canvas2.height);
                    lastScannedCode = null;
                  }, 3000);
                  requestAnimationFrame(tick);
                }).checkDataInList(code.data);
              } else {
                requestAnimationFrame(tick);
              }
            } else {
              requestAnimationFrame(tick);
            }
          } else {
            requestAnimationFrame(tick);
          }
          }
        else{
          let fadetime = [1000,1500,1500];
          let timer =0;
          let alpha = 0;
          switch(show_title[1]){
            case 0:
              show_title[1]=1;
              show_title[2]=new Date().getTime();                  
            break;
            case 1:
              dcac();
              timer = new Date().getTime()-show_title[2];            
              if(timer>fadetime[0]){
                show_title[1]=2;
                show_title[2]=new Date().getTime();
              }
              else{
                alpha = 1-timer/fadetime[0];
                context2.fillStyle="#fff";
                if(alpha<0){alpha=0;}
                context2.globalAlpha = alpha;
                context2.fillRect(0,0,canvas2.width,canvas2.height);
              }
            break;
            case 2:
              dcac();
              timer = new Date().getTime()-show_title[2];            
              if(timer>fadetime[1]){
                show_title[1]=3;
                show_title[2]=new Date().getTime();
              }
            break;
            case 3:
              dcac();
              timer = new Date().getTime()-show_title[2];            
              if(timer>fadetime[2]){
                show_title[1]=4;
                show_title[2]=new Date().getTime();
                context2.fillStyle="#fff";
                context2.globalAlpha=1;
              context2.fillRect(0,0,canvas2.width,canvas2.height);
              }
              else{
                alpha = timer/fadetime[2];
                context2.fillStyle="#fff";
                if(alpha>1){alpha=1;}
                context2.globalAlpha = alpha;
                context2.fillRect(0,0,canvas2.width,canvas2.height);
              }
            break;
            case 4:
              show_title[1]=5;
              context2.clearRect(0, 0, canvas2.width, canvas2.height);
              show_title[0]=false;
            break;
            default:              
            break;
          }
          requestAnimationFrame(tick);
        }
      }

      function dcac(){
        context2.globalAlpha =1;
        context2.fillStyle="#fff";
        context2.fillRect(0,0,canvas2.width,canvas2.height);
        context2.fillStyle="#000";
        context2.font = `Bold 32px Arial`;
        context2.textAlign = "center";
        context2.fillText(String.fromCharCode(81,82,12467,12540,12489,21463,20184,12471,12473,12486,12512),canvas2.width/2,canvas2.height/2-25); 
        context2.font = `Bold 16px Arial`;
        context2.fillText(String.fromCharCode(169,50,48,50,52,32,23398,26657,25945,32946,24773,22577,20966,29702,30740,31350,20250),canvas2.width/2,canvas2.height/2+25);
      }
    </script>
